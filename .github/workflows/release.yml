name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64 and ARM64
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.deleted && github.ref_name != 'v0.1.0') }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          skip-lts-prepass: true

      - name: Build standalone Windows executables
        shell: pwsh
        run: ./Publish-Windows.ps1

      - name: Stage executables
        shell: pwsh
        run: |
          $versionSuffix = ''
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
              $versionSuffix = '-' + ($env:GITHUB_REF_NAME -replace '[^a-zA-Z0-9._+-]', '-')
          }
          foreach ($arch in 'x64', 'arm64') {
              Copy-Item -LiteralPath "dist/$arch/Bd2Achievement.exe" -Destination "dist/$arch/Bd2Achievement$versionSuffix-win-$arch.exe"
          }

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: Bd2Achievement-win-x64
          path: dist/x64/*-win-x64.exe
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Upload Windows ARM64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: Bd2Achievement-win-arm64
          path: dist/arm64/*-win-arm64.exe
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    name: Publish tag release
    if: ${{ github.event_name == 'push' }}
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Bd2Achievement-win-*
          path: release-assets
          merge-multiple: true

      - name: Upload executables to the tag release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:GITHUB_REF_NAME
          $fileVersion = $tag -replace '[^a-zA-Z0-9._+-]', '-'
          $assets = @(
              foreach ($arch in 'x64', 'arm64') {
                  (Get-Item -LiteralPath "release-assets/Bd2Achievement-$fileVersion-win-$arch.exe").FullName
              }
          )

          $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets 2>$null
          if ($LASTEXITCODE -ne 0) {
              gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --verify-tag --title "Bd2Achievement $tag" --generate-notes
              if ($LASTEXITCODE -ne 0) { throw "Could not create release $tag." }
              return
          }

          $existing = ($release | ConvertFrom-Json).assets.name
          $missing = @($assets | Where-Object { (Split-Path -Leaf $_) -notin $existing })
          if ($missing.Count) {
              gh release upload $tag @missing --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) { throw "Could not upload artifacts for $tag." }
          }
